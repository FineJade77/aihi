[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aihi-agent"
version = "0.1.0"
description = "Recoverable provider-neutral Agent Runtime for AIHI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aihi-models>=0.1,<0.2",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aihi"]
artifacts = ["src/aihi/agent/py.typed"]
