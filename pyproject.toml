[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiharness"
version = "0.1.0"
description = "A production-shaped runtime for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
aih = "aiharness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aiharness"]
