[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiharness"
version = "0.1.0"
description = "A production-shaped runtime for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The harness is a library. Its CLI lives in an application.
aicode = [
  "typer>=0.12",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]


[tool.hatch.build.targets.wheel]
packages = ["src/aiharness"]
# Without this the marker is dropped and every consumer's type checker treats
# this strictly typed library as untyped.
artifacts = ["src/aiharness/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
# The application layer is checked too: it is where composition mistakes land.
packages = ["aiharness", "aicode"]
mypy_path = "src:aicode/src"

# An optional extra: aicode falls back to input() when it is absent, so the
# type check must pass whether or not it is installed.
[[tool.mypy.overrides]]
module = "prompt_toolkit.*"
ignore_missing_imports = true
