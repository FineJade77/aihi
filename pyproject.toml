[tool.uv.workspace]
members = ["packages/aihi/models", "packages/aihi/agent", "packages/aihi/code-agent"]

[tool.aihi.release]
python-distributions = ["packages/aihi/models", "packages/aihi/agent"]

[dependency-groups]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "packages/aihi/models/tests",
  "packages/aihi/agent/tests",
  "packages/aihi/code-agent/tests",
  "tests",
]
pythonpath = [
  ".",
  "packages/aihi/models/src",
  "packages/aihi/agent/src",
  "packages/aihi/code-agent/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aihi.models", "aihi.agent", "aihi.code_agent"]
mypy_path = "packages/aihi/models/src:packages/aihi/agent/src:packages/aihi/code-agent/src"
