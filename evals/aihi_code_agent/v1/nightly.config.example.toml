# Copy this file outside the repository and replace the model/image values.
# The API key stays in the named environment variable; never put its value in
# this file. Pass multiple external config files to compare models/providers.

[provider]
name = "openai"
model = "REPLACE_WITH_MODEL"
api_key_env = "OPENAI_API_KEY"

[agent]
access_mode = "full_access"
run_mode = "execute"
max_output_tokens = 8192

[sandbox]
backend = "docker"
image = "python:3.11-slim"
network = "none"
allow_network = false

[artifacts]
enabled = false

[audit]
enabled = false

[subagents]
enabled = false
