[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicode"
version = "0.1.0"
description = "Coding Agent application composed from the AIHarness runtime"
requires-python = ">=3.11"
dependencies = [
  "aiharness>=0.1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Line editing, history and slash-command completion for `aicode chat`. The TUI
# degrades to input() without it rather than refusing to start.
tui = ["prompt_toolkit>=3.0"]

[project.scripts]
aicode = "aicode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicode"]

[tool.pytest.ini_options]
pythonpath = ["src", "../src"]
